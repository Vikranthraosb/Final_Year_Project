<!DOCTYPE html>
<html>
  <head>
    <title>ATTENDANCE</title>
    <link rel="stylesheet" type="text/css" href="/static/style.css">
    <style>
      body{
      
      background-image: url("/static/home.png") ;
      background-size: 100%;
      background-repeat: no-repeat;
      background-position-y: 40px;
      
      }

      .form {
        text-align: center;
      }

      .round-button {
        margin-top: 20px;
      }

      .round-button button {
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 50%;
        width: 150px;
        height: 150px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
        transition: background-color 0.3s ease;
      }

      .round-button button:hover {
        background-color: #45a049;
      }
    </style>
          </style>
  </head>
  <body >
    <nav>
      <ul>
        <li><a  href="/">LOGOUT</a></li>
        <li><a  href="checkattpage" >CHECK ATTENDANCE</a></li>
       
        
      </ul>
    </nav>
<br><br><br><br>

<div class="form">
    <h2>ENABLE ATTENDANCE MARKING</h2>
    <div class="flashes">
      {% for message in get_flashed_messages() %}
        {{ message }}
      {% endfor %}
    </div>
    <div class="round-button">
      <form action="enableattendance" method="POST">
        <button type="submit">ENABLE ATTENDANCE</button>
      </form>
    </div>
  </div>
  </body>
</html>
